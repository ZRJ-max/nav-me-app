<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV Me 🧭 | اكتشف بوصلتك ومسارك من الصفر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --secondary: #0d9488;
            --secondary-dark: #0f766e;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; line-height: 1.6; }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 45px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        header h1 { font-size: 2.6rem; font-weight: 800; margin-bottom: 10px; }
        header p { font-size: 1.15rem; opacity: 0.9; max-width: 680px; margin: 0 auto; }

        .container { max-width: 860px; margin: -25px auto 0; padding: 0 20px; }

        .card {
            background: var(--surface);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.06);
            margin-bottom: 28px;
            border: 1px solid var(--border);
        }

        .section-title {
            display: flex; align-items: center; gap: 12px; font-size: 1.35rem;
            color: var(--primary); border-bottom: 2px solid #f1f5f9;
            padding-bottom: 14px; margin-bottom: 22px;
        }

        .question-group { margin-bottom: 22px; }
        .question-group label { display: block; font-weight: 600; margin-bottom: 10px; color: #334155; font-size: 1rem; }
        
        .question-group textarea {
            width: 100%; padding: 12px 15px; border: 1.5px solid #cbd5e1;
            border-radius: 10px; font-size: 0.95rem; resize: vertical; min-height: 70px; background: #fafafa;
        }
        .question-group textarea:focus { outline: none; background: #fff; border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15); }

        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-group label {
            font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer;
            background: #f1f5f9; padding: 8px 20px; border-radius: 8px; border: 1px solid #cbd5e1; transition: all 0.2s;
        }
        .radio-group input[type="radio"] { accent-color: var(--secondary); }
        .radio-group label:hover { background: #e2e8f0; }

        .btn {
            background: var(--secondary); color: white; border: none; padding: 18px 32px;
            font-size: 1.15rem; font-weight: 700; border-radius: 12px; cursor: pointer;
            width: 100%; transition: all 0.2s; box-shadow: 0 4px 14px rgba(13, 148, 136, 0.25);
        }
        .btn:hover { background: var(--secondary-dark); }

        .loading-overlay { display: none; text-align: center; padding: 40px 20px; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top: 5px solid var(--secondary);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #results { display: none; }
        .dna-badge {
            background: #fef3c7; color: #92400e; padding: 6px 18px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 700; display: inline-block; margin-bottom: 18px; border: 1px solid #fde68a;
        }
    </style>
</head>
<body>

<header>
    <h1>NAV Me 🧭</h1>
    <p>لا تعرف ماذا تريد أو ما هو شغفك؟ دعنا نكتشف بوصلتك من الصفر.</p>
</header>

<div class="container">
    <form id="quizForm">
        <div class="card">
            <div class="section-title"><span>🏛️</span><h3>المحور الأول: البُعد الفطري والتيسير</h3></div>
            <div class="question-group"><label>1. هل تجد نفسك تميل بشكل طبيعي وفطري لمتابعة مواضيع معينة دون إجبار؟</label>
                <div class="radio-group"><label><input type="radio" name="q1" value="نعم" required> نعم</label><label><input type="radio" name="q1" value="لا"> لا</label></div></div>
            <div class="question-group"><label>2. ما هو النشاط البسيط الذي يطلبه منك أصدقاؤك دائماً لأنك تفعله بسهولة؟</label><textarea id="q2" required></textarea></div>
            <div class="question-group"><label>3. هل تشعر براحة أكبر عند إنجاز أعمال تخدم الناس وتحل مشاكلهم مباشرة؟</label>
                <div class="radio-group"><label><input type="radio" name="q3" value="نعم" required> نعم</label><label><input type="radio" name="q3" value="لا"> لا</label></div></div>
            <div class="question-group"><label>4. هل تفضل الأعمال التي تعتمد على الترتيب والإدارة والتنظيم؟</label>
                <div class="radio-group"><label><input type="radio" name="q4" value="نعم" required> نعم</label><label><input type="radio" name="q4" value="لا"> لا</label></div></div>
            <div class="question-group"><label>5. اذكر شيئاً واحداً تشعر أنك تجيده تماماً مقارنة بمن حولك:</label><textarea id="q5" required></textarea></div>
        </div>

        <div class="card">
            <div class="section-title"><span>🧠</span><h3>المحور الثاني: البُعد النفسي والذاتي</h3></div>
            <div class="question-group"><label>6. هل تفضل العمل والتركيز بمفردك في بيئة هادئة؟</label>
                <div class="radio-group"><label><input type="radio" name="q6" value="نعم" required> نعم</label><label><input type="radio" name="q6" value="لا"> لا</label></div></div>
            <div class="question-group"><label>7. ما هو النشاط الذي إذا بدأت به تنسى الوقت تماماً؟</label><textarea id="q7" required></textarea></div>
            <div class="question-group"><label>8. هل تميل بطبيعتك إلى التفكير المنطقي وتحليل الأرقام أكثر من الفنون؟</label>
                <div class="radio-group"><label><input type="radio" name="q8" value="نعم" required> نعم</label><label><input type="radio" name="q8" value="لا"> لا</label></div></div>
            <div class="question-group"><label>9. هل تمتلك الصبر للجلوس طويلاً وتدقيق التفاصيل الصغيرة؟</label>
                <div class="radio-group"><label><input type="radio" name="q9" value="نعم" required> نعم</label><label><input type="radio" name="q9" value="لا"> لا</label></div></div>
            <div class="question-group"><label>10. هل تحب البحث عن حلول مبتكرة للمشاكل أم اتباع تعليمات جاهزة؟</label><textarea id="q10" required></textarea></div>
        </div>

        <div class="card">
            <div class="section-title"><span>🌐</span><h3>المحور الثالث: البُعد الاجتماعي والواقعي</h3></div>
            <div class="question-group"><label>11. هل تستهويك القطاعات التقنية الحديثة والبرمجة والذكاء الاصطناعي؟</label>
                <div class="radio-group"><label><input type="radio" name="q11" value="نعم" required> نعم</label><label><input type="radio" name="q11" value="لا"> لا</label></div></div>
            <div class="question-group"><label>12. ما هي المشكلة في مجتمعك التي تتمنى المساهمة في حلها؟</label><textarea id="q12" required></textarea></div>
            <div class="question-group"><label>13. هل تحب أن تكون في واجهة التأثير والتحدث للجمهور؟</label>
                <div class="radio-group"><label><input type="radio" name="q13" value="نعم" required> نعم</label><label><input type="radio" name="q13" value="لا"> لا</label></div></div>
            <div class="question-group"><label>14. هل لديك المرونة لتغيير مكان إقامتك أو تعلم مهارات جديدة من الصفر؟</label>
                <div class="radio-group"><label><input type="radio" name="q14" value="نعم" required> نعم</label><label><input type="radio" name="q14" value="لا"> لا</label></div></div>
            <div class="question-group"><label>15. في كلمة أو كلمتين، كيف تصف شعورك الحالي تجاه مستقبلك المهني؟</label><textarea id="q15" required></textarea></div>
        </div>

        <button type="submit" class="btn">اكتشف بوصلتي ومساري الآن 🚀</button>
    </form>

    <div id="loading" class="card loading-overlay">
        <div class="spinner"></div>
        <h3 style="color: var(--primary);">جاري تحليل إجاباتك واستخراج بصمة مسارك...</h3>
    </div>

    <div id="results" class="card">
        <div class="dna-badge">Career DNA Profile</div>
        <div id="reportContainer"></div>
        <button onclick="window.print()" class="btn" style="background: var(--primary); margin-top: 25px;">طباعة التقرير PDF 🖨️</button>
    </div>
</div>

<script>
    document.getElementById('quizForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        let answersData = "";
        for (let i = 1; i <= 15; i++) {
            let answerText = "";
            const textarea = document.getElementById(`q${i}`);
            if (textarea) { answerText = textarea.value.trim(); } 
            else {
                const radios = document.getElementsByName(`q${i}`);
                for (const r of radios) { if (r.checked) { answerText = r.value; break; } }
            }
            answersData += `س${i}: ${answerText}\n`;
        }

        document.getElementById('quizForm').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        window.scrollTo({ top: 100, behavior: 'smooth' });

        try {
            const response = await fetch('/api/evaluate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers: answersData })
            });
            const data = await response.json();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('reportContainer').innerHTML = data.result;
        } catch (err) {
            alert('حدث خطأ. يرجى المحاولة لاحقاً.');
            document.getElementById('loading').style.display = 'none';
            document.getElementById('quizForm').style.display = 'block';
        }
    });
</script>
</body>
</html>
